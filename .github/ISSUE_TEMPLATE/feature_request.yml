name: Feature request
description: Something you'd like Arclasp to do that it doesn't today.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: search existing issues and discussions so related use
        cases can be grouped. Concrete workflow details help decide whether a
        request belongs in the SDK, hosted governance service, an integration,
        or documentation.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        What are you trying to do that Arclasp doesn't currently support?
        Real use cases beat abstract feature descriptions.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would the solution look like?
      description: |
        How would you want this to work? A code snippet showing the ideal API
        is great if you have one in mind.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: |
        Workarounds you've used, other tools you've looked at, etc.
    validations:
      required: false

  - type: dropdown
    id: blocking
    attributes:
      label: Is this blocking your adoption?
      description: |
        Honest answer helps me prioritize.
      options:
        - Yes, I can't use Arclasp without this
        - Sort of, I'm working around it
        - No, but it would be nice
    validations:
      required: true
