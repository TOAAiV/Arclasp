name: Bug report
description: Something isn't working the way the docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. A few details up front make it much faster
        to fix.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did you see?
      placeholder: |
        I called `chain.record_agent_action` with payload X and expected the
        approval gate to block, but the governed action continued without a
        required backend approval.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimum reproduction
      description: |
        A small code snippet that reproduces the issue. If the issue involves
        a framework adapter, please include the framework version.
      render: python
    validations:
      required: false

  - type: input
    id: arclasp-version
    attributes:
      label: Arclasp version
      description: Output of `pip show arclasp | grep Version`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - LangGraph
        - LangChain
        - CrewAI
        - MCP
        - None (manual instrumentation)
    validations:
      required: true

  - type: input
    id: framework-version
    attributes:
      label: Framework version (if applicable)
      placeholder: "langgraph 0.2.1"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: SDK warnings, tracebacks, anything from `arclasp` log lines.
      render: shell
