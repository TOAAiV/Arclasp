[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[project]
name = "arclasp"
version = "0.1.0b1"
description = "Runtime governance for AI-agent workflows with stateful policy, human approval, fail-closed controls, and verifiable evidence."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Ansh Pradhan", email = "hello@arclasp.com" },
]
keywords = [
    "ai",
    "agents",
    "governance",
    "policy",
    "audit",
    "langchain",
    "langgraph",
    "crewai",
    "mcp",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3.0,<0.4.0",
]
langgraph = [
    "langgraph>=0.2.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
]
# CrewAI requires Python <3.14 due to its own dependency constraints.
# Users on Python 3.14+ should use Python 3.10-3.13 for CrewAI integration.
crewai = [
    "crewai>=1.10.0,<2.0.0; python_version < '3.14'",
]
mcp = [
    "mcp>=1.0.0,<2.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff==0.16.3",
    "pyright>=1.1",
]
all = [
    "langchain-core>=0.3.0,<0.4.0",
    "langgraph>=0.2.0,<0.4.0",
    "crewai>=1.10.0,<2.0.0; python_version < '3.14'",
    "mcp>=1.0.0,<2.0.0",
]

[project.urls]
Homepage = "https://arclasp.com"
Documentation = "https://docs.arclasp.com"
Repository = "https://github.com/TOAAiV/Arclasp"
Issues = "https://github.com/TOAAiV/Arclasp/issues"
Changelog = "https://github.com/TOAAiV/Arclasp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["arclasp"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".measure/",
    ".measure_full/",
    ".venv311/",
    ".venv/",
    ".venv*/",
    "dist/",
    "*.egg-info/",
    "__pycache__/",
    ".pytest_cache/",
    ".github/",
    "verify-scripts/",
    "verify-docker.ps1",
    "Dockerfile.verify",
    "import_times.txt",
    "tests/",
    "demos/",
    "verification-artifacts/",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
