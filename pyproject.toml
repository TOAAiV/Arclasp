[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofrail"
version = "0.1.0"
description = "AI Agent Governance Layer SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
]
langgraph = [
    "langgraph>=0.1.0",
    "langchain-core>=0.1.0",
]
crewai = [
    # Lower bound 1.10.0 reflects approximate first stable 1.x release; tested against 1.14.6.
    "crewai>=1.10.0,<2.0.0",
]
mcp = [
    "mcp>=1.0.0",
]
all = [
    "langchain-core>=0.1.0",
    "langgraph>=0.1.0",
    # Lower bound 1.10.0 reflects approximate first stable 1.x release; tested against 1.14.6.
    "crewai>=1.10.0,<2.0.0",
    "mcp>=1.0.0",
]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that require a running local backend (deselect with '-m not e2e')",
]

[tool.hatch.build.targets.wheel]
packages = ["proofrail"]
