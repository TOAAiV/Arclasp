[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arclasp"
version = "0.1.0a9"
description = "Runtime governance for AI agent chains."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Ansh Pradhan", email = "hello@proofrail.dev" },
]
keywords = [
    "ai",
    "agents",
    "governance",
    "policy",
    "audit",
    "langchain",
    "langgraph",
    "crewai",
    "mcp",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3.0,<0.4.0",
]
langgraph = [
    "langgraph>=0.2.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
]
# CrewAI requires Python <3.14 due to its own dependency constraints.
# Users on Python 3.14+ should use Python 3.10-3.13 for CrewAI integration.
crewai = [
    "crewai>=1.10.0,<2.0.0; python_version < '3.14'",
]
mcp = [
    "mcp>=1.0.0,<2.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.0.0,<4.1.0",  # passlib 1.7 + bcrypt 4.1+ breaks CryptContext.hash()
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "ruff>=0.6",
    "pyright>=1.1",
]
all = [
    "langchain-core>=0.3.0,<0.4.0",
    "langgraph>=0.2.0,<0.4.0",
    "crewai>=1.10.0,<2.0.0; python_version < '3.14'",
    "mcp>=1.0.0,<2.0.0",
]

[project.urls]
Homepage = "https://proofrail.dev"
Documentation = "https://docs.proofrail.dev"
Repository = "https://github.com/TOAAiV/proofrail"
Issues = "https://github.com/TOAAiV/proofrail/issues"
Changelog = "https://github.com/TOAAiV/proofrail/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that require a running local backend (deselect with '-m not e2e')",
]

[tool.hatch.build.targets.wheel]
packages = ["proofrail"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".measure/",
    ".measure_full/",
    ".venv311/",
    ".venv/",
    "dist/",
    "*.egg-info/",
    "__pycache__/",
    ".pytest_cache/",
    ".github/",
    "verify-scripts/",
    "verify-docker.ps1",
    "Dockerfile.verify",
    "import_times.txt",
    "AUDIT_FINDINGS.md",
    "BACKLOG.md",
    "CODE_QUALITY_FINDINGS.md",
]
