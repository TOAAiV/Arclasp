[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aag"
version = "0.1.0"
description = "AI Agent Governance Layer SDK"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["aag"]
